.card .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.card .tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#b8864a15;color:#b8864a;font-weight:500}
.card .designer{color:#999;font-size:12px;margin-top:8px}
.card.error img{opacity:.3}
.card.error{border:2px solid #e53e3e}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px}
.filter-btn{padding:6px 16px;border-radius:99px;border:1px solid #ddd;background:white;cursor:pointer;font-size:13px;transition:all .15s}
.filter-btn.active{background:#b8864a;color:white;border-color:#b8864a}

// Collect all unique tags
const allTags = [...new Set(projects.flatMap(p => p.tags))].sort();
const filtersEl = document.getElementById('filters');
let activeTag = null;

// Render filter buttons
const allBtn = document.createElement('button');
allBtn.className = 'filter-btn active';
allBtn.textContent = `All (${projects.length})`;
allBtn.onclick = () => { activeTag = null; render(); };
filtersEl.appendChild(allBtn);

allTags.forEach(tag => {
  const count = projects.filter(p => p.tags.includes(tag)).length;
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.textContent = `${tag} (${count})`;
  btn.onclick = () => { activeTag = tag; render(); };
  filtersEl.appendChild(btn);
});

let loadedCount = 0;
let errorCount = 0;

function render() {
  const filtered = activeTag ? projects.filter(p => p.tags.includes(activeTag)) : projects;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  // Update active button
  filtersEl.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', activeTag ? btn.textContent.startsWith(activeTag) : btn.textContent.startsWith('All'));
  });

  filtered.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    const img = new Image();
    img.src = `/images/designers/projects/covers/cover-${String(p.idx).padStart(3,'0')}.jpg`;
    img.alt = p.title;
    img.loading = 'lazy';
    img.onerror = () => { card.classList.add('error'); };
    card.innerHTML = `<div class="info">
      <div class="idx">cover-${String(p.idx).padStart(3,'0')}.jpg</div>
      <div class="title">${p.title}</div>
      <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <div class="designer">${p.designer}</div>
    </div>`;
    card.insertBefore(img, card.firstChild);
    grid.appendChild(card);
  });
}
