# Tarmeer 官网 Nginx 配置

# HTTP → HTTPS 重定向（www + 裸域名）
server {
    listen 80;
    server_name www.tarmeer.com tarmeer.com;
    return 301 https://www.tarmeer.com$request_uri;
}

# 裸域名 HTTPS → www 重定向
server {
    listen 443 ssl;
    server_name tarmeer.com;

    ssl_certificate "/cicd/tarmeer.com_nginx/tarmeer.com_bundle.pem";
    ssl_certificate_key "/cicd/tarmeer.com_nginx/tarmeer.com.key";

    return 301 https://www.tarmeer.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.tarmeer.com;
    root /tarmeer/tarmeer_web_portal;
    index index.html;

    # SSL 证书
    ssl_certificate "/cicd/tarmeer.com_nginx/tarmeer.com_bundle.pem";
    ssl_certificate_key "/cicd/tarmeer.com_nginx/tarmeer.com.key";
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;
    ssl_ciphers PROFILE=SYSTEM;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25m;

    # Gzip 压缩（减少 70% 传输量）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # 静态上传文件目录（^~ 保证优先于图片/JS/CSS 正则）
    location ^~ /uploads/ {
        alias /tarmeer/tarmeer_web_portal/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 静态图片缓存（hero、logo、uae-companies 等）
    location ~* \.(jpg|jpeg|png|gif|webp|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Vary Accept;
    }

    # JS/CSS 带 hash，长期缓存
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 后端 API 代理（^~ 保证优先于图片/JS/CSS 正则，避免 /api/uploads/*.webp 被拦截）
    location ^~ /api/ {
        proxy_pass http://localhost:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # index.html：永不缓存，确保部署后用户立即拿到最新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # SPA：非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
