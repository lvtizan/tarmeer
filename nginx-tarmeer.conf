# Tarmeer 官网 Nginx 配置

# HTTP → HTTPS 重定向（www + 裸域名）
server {
    listen 80;
    server_name www.tarmeer.com tarmeer.com;
    return 301 https://www.tarmeer.com$request_uri;
}

# 裸域名 HTTPS → www 重定向
server {
    listen 443 ssl;
    server_name tarmeer.com;

    ssl_certificate "/cicd/tarmeer.com_nginx/tarmeer.com_bundle.pem";
    ssl_certificate_key "/cicd/tarmeer.com_nginx/tarmeer.com.key";

    return 301 https://www.tarmeer.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.tarmeer.com;
    root /tarmeer/tarmeer_web_portal;
    index index.html;

    # SSL 证书
    ssl_certificate "/cicd/tarmeer.com_nginx/tarmeer.com_bundle.pem";
    ssl_certificate_key "/cicd/tarmeer.com_nginx/tarmeer.com.key";
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;
    ssl_ciphers PROFILE=SYSTEM;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25m;

    # 静态上传文件目录（图片、文件等）
    location /uploads/ {
        alias /tarmeer/tarmeer_web_portal/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 代理
    location /api/ {
        proxy_pass http://localhost:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA：非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
