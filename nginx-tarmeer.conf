# Tarmeer 官网 Nginx 配置
# 用法：由 deploy-codex.sh 自动同步到服务器 /etc/nginx/conf.d/tarmeer.conf
# 手动部署：scp nginx-tarmeer.conf root@47.91.108.104:/etc/nginx/conf.d/tarmeer.conf && nginx -t && systemctl reload nginx

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name www.tarmeer.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name www.tarmeer.com;
    root /tarmeer/tarmeer_web_portal;
    index index.html;

    # SSL 证书
    ssl_certificate "/cicd/tarmeer.com_nginx/tarmeer.com_bundle.pem";
    ssl_certificate_key "/cicd/tarmeer.com_nginx/tarmeer.com.key";
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;
    ssl_ciphers PROFILE=SYSTEM;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25m;

    # 后端头像/上传文件代理
    location /uploads/ {
        proxy_pass http://localhost:3002/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # 后端 API 代理
    location /api/ {
        proxy_pass http://localhost:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA：非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
