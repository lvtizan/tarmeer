# Tarmeer staging Nginx 配置
# 用法：由运维合并到服务器 Nginx，域名指向 staging.tarmeer.com

server {
    listen 80;
    server_name staging.tarmeer.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name staging.tarmeer.com;
    root /tarmeer/tarmeer_web_portal_staging;
    index index.html;

    ssl_certificate "/cicd/tarmeer.com_nginx/tarmeer.com_bundle.pem";
    ssl_certificate_key "/cicd/tarmeer.com_nginx/tarmeer.com.key";
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;
    ssl_ciphers PROFILE=SYSTEM;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25m;

    location /uploads/ {
        proxy_pass http://localhost:3002/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://localhost:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
